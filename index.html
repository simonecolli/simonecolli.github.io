<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        // Apply the theme before styles load to avoid a flash on startup.
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <meta name="color-scheme" content="light dark" />
    <style>@layer properties, theme, base, components, utilities;</style>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-light-32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-dark-32.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-light-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="preload"
      href="/assets/fonts/inter.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Simone Colli</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module" prerender src="/src/prerender.tsx"></script>
  </body>
</html>
